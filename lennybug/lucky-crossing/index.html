<!doctype html>
<html lang="en">
<head>

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<title>Lucky Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed studio shot. The street light is the page; type sits in the corners like a poster. */
:root{
  --studio:#dfe2e7;        /* seamless paper, cool grey */
  --studio-deep:#c6cad1;
  --ink:#14161a;
  --ink-soft:#5a606b;
  --glass:rgba(255,255,255,.62);
  --glass-line:rgba(20,22,26,.12);
  --stop:#ff2a3c;
  --smile:#ffb400;
  --go:#18d867;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --text:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--studio);color:var(--ink);font-family:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(120% 90% at 55% 40%,#eef0f3 0%,var(--studio) 55%,var(--studio-deep) 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.point{cursor:pointer}
#gl.drag{cursor:grabbing}

.corner{position:absolute;pointer-events:none;display:flex;gap:6px}
.tl{top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));flex-direction:column}
.tr{top:calc(20px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));flex-direction:column;align-items:flex-end;text-align:right;max-width:min(44vw,260px)}
.brand{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(20px,3.2vw,34px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;margin:0}
.sub{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.hint{font-size:13px;line-height:1.35;color:var(--ink-soft);font-weight:500;text-wrap:balance}

.dock{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock button{pointer-events:auto;font:600 13px/1 var(--text);color:var(--ink);background:var(--glass);border:1px solid var(--glass-line);
  border-radius:999px;padding:10px 14px 10px 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);transition:transform .15s ease,background .15s ease;min-width:0}
.dock button:hover{background:rgba(255,255,255,.85)}
.dock button:active{transform:scale(.96)}
.dock button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dock .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.dock .name{white-space:nowrap}
#party{background:var(--ink);color:#fff;border-color:var(--ink);padding-left:14px}
#party:hover{background:#2a2e36}
#snd{padding:10px 11px}
#snd .off,#snd[aria-pressed="false"] .on{display:none}
#snd[aria-pressed="false"] .off{display:inline}
#snd[aria-pressed="false"]{color:var(--ink-soft)}
#party[aria-pressed="true"]{background:linear-gradient(90deg,#ff2a3c,#ffb400,#18d867,#2aa8ff,#b04dff);border-color:transparent}

#tip{position:absolute;left:0;top:0;pointer-events:none;font:600 12px/1 var(--text);letter-spacing:.02em;color:#fff;background:rgba(20,22,26,.88);
  padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .15s ease;will-change:transform}
#tip.on{opacity:1}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;color:var(--ink-soft)}
@media (max-width:520px){
  .tr{display:none}
  .dock button{font-size:12px;padding:9px 11px 9px 10px}
}
@media (prefers-reduced-motion:reduce){.dock button{transition:none}}
</style>

<div id="stage">
  <canvas id="gl" tabindex="-1" aria-label="A 3D street light with three animated lights, two signs and a push button. Use the buttons below to control it."></canvas>
  <div class="corner tl">
    <h1 class="brand">Lucky<br>Crossing</h1>
    <span class="sub">Stop · Smile · Go</span>
  </div>
  <div class="corner tr">
    <span class="hint">Tap a light to change its symbol. Tap the signs. Push the yellow button. Drag to look around. Sound on is best.</span>
  </div>
  <div class="dock">
    <button type="button" id="b0" aria-label="Change the top light"><span class="dot" style="color:var(--stop);background:var(--stop)"></span><span class="name" id="n0">Heartbeat</span></button>
    <button type="button" id="b1" aria-label="Change the middle light"><span class="dot" style="color:var(--smile);background:var(--smile)"></span><span class="name" id="n1">Smiley</span></button>
    <button type="button" id="b2" aria-label="Change the bottom light"><span class="dot" style="color:var(--go);background:var(--go)"></span><span class="name" id="n2">Lucky clover</span></button>
    <button type="button" id="party" aria-pressed="false">Party</button>
    <button type="button" id="snd" aria-pressed="true" aria-label="Sound"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  </div>
  <div id="tip"></div>
  <div id="fail" hidden>This piece needs WebGL, and it could not start on this device.</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('gl');
const stage = document.getElementById('stage');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────── math helpers ───────────── */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const hash2 = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

class Spring {
  constructor(k = 120, c = 12, x = 0) { this.x = x; this.v = 0; this.t = x; this.k = k; this.c = c; }
  step(dt) { const n = Math.max(1, Math.ceil(dt / 0.008)); const h = dt / n;
    for (let i = 0; i < n; i++) { this.v += (-(this.x - this.t) * this.k - this.v * this.c) * h; this.x += this.v * h; } return this.x; }
}

/* ───────────── renderer ───────────── */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('fail').hidden = false; throw e; }
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);

/* background: soft seamless paper */
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  const gr = g.createRadialGradient(290, 200, 20, 256, 256, 420);
  gr.addColorStop(0, '#f1f2f5'); gr.addColorStop(.55, '#e0e3e8'); gr.addColorStop(1, '#c4c8d0');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}

/* environment: a hand-built softbox studio, for chrome that reads as chrome */
{
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(.42, .43, .46), side: THREE.BackSide })));
  const card = (w, h, x, y, z, v, tint) => {
    const col = new THREE.Color(v, v, v); if (tint) col.multiply(new THREE.Color(tint));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  card(9, 9, 7, 8, 8, 5.5);            // key softbox
  card(4, 14, -11, 1, 5, 2.6, '#eef4ff'); // long strip, left
  card(14, 4, 0, 13, -1, 3);          // overhead
  card(3, 12, 10, 0, -7, 3.5, '#fff3e0'); // rim, back right
  card(3, 12, -8, 2, -9, 2.2);          // rim, back left
  card(5, 16, -2.5, 0, 12, .015);     // black flag: the dark streak in the chrome
  card(3, 16, 6.5, -2, 11, .02);
  card(22, 6, 0, -12, 3, .08);        // dark floor
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, 0.015).texture;
  scene.environmentIntensity = 0.85;
  pm.dispose();
}

/* lights */
const key = new THREE.DirectionalLight(0xfff6ea, 2.0);
key.position.set(3.2, 5.5, 6.5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.6, right: 2.6, top: 3.2, bottom: -3.2, near: 1, far: 20 });
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.015; key.shadow.radius = 5;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdfe9ff, 0.6); rim.position.set(-5, 2, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9bec8, 0.2));

/* ───────────── textures ───────────── */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t;
}
// fine orange-peel bump for paint
const peel = canvasTex(256, 256, (g, w, h) => {
  const id = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { const v = 118 + Math.random() * 20; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0); g.filter = 'blur(1.2px)'; g.drawImage(g.canvas, 0, 0);
}, false);
peel.wrapS = peel.wrapT = THREE.RepeatWrapping; peel.repeat.set(3, 3);
// brushed streaks for steel roughness
const brushed = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? 255 : 0},${Math.random() < .5 ? 255 : 0},0,${Math.random() * .08})`; g.fillRect(0, Math.random() * h, w, 1 + Math.random() * 1.5); }
}, false);
brushed.wrapS = brushed.wrapT = THREE.RepeatWrapping;

/* ───────────── materials ───────────── */
const M = {
  chrome: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.06 }),
  pole: new THREE.MeshPhysicalMaterial({ color: 0xf2f4f7, metalness: 1, roughness: 0.11 }),
  steel: new THREE.MeshPhysicalMaterial({ color: 0xc4c8ce, metalness: 1, roughness: 0.34, roughnessMap: brushed }),
  yellow: new THREE.MeshPhysicalMaterial({ color: 0xf0a400, roughness: 0.45, envMapIntensity: 0.75, clearcoat: 1, clearcoatRoughness: 0.1, bumpMap: peel, bumpScale: 0.35 }),
  black: new THREE.MeshPhysicalMaterial({ color: 0x08090b, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 0.7 }),
  cavity: new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.85 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.7 }),
  // dielectric reflection layer only: black diffuse, 4% Fresnel specular, added on top of the LEDs
  glass: new THREE.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.03, metalness: 0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, envMapIntensity: 1.6 }),
};
const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const mesh = (g, m) => shadowed(new THREE.Mesh(g, m));

/* ───────────── the rig ───────────── */
const rig = new THREE.Group(); scene.add(rig);
const POLE_R = 0.11;
const pickables = [];
const proxyMat = new THREE.MeshBasicMaterial({ visible: false });
function proxy(geo, hit, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, proxyMat); m.position.set(x, y, z); m.userData.hit = hit; parent.add(m); pickables.push(m); return m;
}

// pole
{
  const p = mesh(new THREE.CylinderGeometry(POLE_R, POLE_R, 16, 72, 1, true), M.pole); p.position.y = -1; rig.add(p);
}
function clampBand(y, r = POLE_R + 0.012, h = 0.075) {
  const g = new THREE.Group(); g.position.y = y;
  g.add(mesh(new THREE.CylinderGeometry(r, r, h, 56), M.steel));
  for (const s of [-1, 1]) { // little bolted ear on the back
    const b = mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.02, 6), M.chrome); b.rotation.x = PI / 2; b.position.set(s * 0.045, 0, r - 0.002); g.add(b);
  }
  rig.add(g); return g;
}
function tube(ax, ay, az, bx, by, bz, r, mat = M.chrome) {
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz), d = b.clone().sub(a);
  const m = mesh(new THREE.CylinderGeometry(r, r, d.length(), 28), mat);
  m.position.copy(a).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); return m;
}

/* ── LED lens shader ── */
const NDOT = 28;
const ledVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const ledFrag = `
precision highp float;
uniform sampler2D tDots; uniform sampler2D tGlow; uniform float uN; uniform float uGain;
varying vec2 vUv;
void main(){
  vec2 p = vUv*2.0-1.0; float r = length(p);
  vec2 g = vUv*uN; vec2 cell = floor(g); vec2 f = fract(g)-0.5;
  vec2 cuv = (cell+0.5)/uN;
  float inside = step(length(cuv*2.0-1.0), 0.965);
  vec3 c = texture2D(tDots, cuv).rgb; c *= c;
  float d = length(f);
  float px = fwidth(g.x);
  float dotm = smoothstep(0.43+px, 0.43-px, d);
  float core = smoothstep(0.40, 0.0, d);
  vec3 lit = c * uGain * (0.35 + 1.25*core*core) * dotm;
  vec3 body = vec3(0.016,0.016,0.018) * dotm * (0.5 + core);      // unlit LED domes
  vec3 glow = texture2D(tGlow, vUv).rgb; glow *= glow;
  vec3 col = (lit + body) * inside + glow * uGain * 0.085 + vec3(0.0035);
  // when dots are smaller than a pixel, fall back to the smooth image so nothing shimmers
  float k = smoothstep(0.30, 0.75, px);
  col = mix(col, glow * uGain * 0.42, k);
  col *= smoothstep(1.0, 0.93, r);
  gl_FragColor = vec4(col, 1.0);
}`;

/* ── LED programs: tiny procedural animations, drawn per dot ── */
const AA = 2 / NDOT * 1.05;
const cov = d => clamp(0.5 - d / AA, 0, 1);
const put = (o, r, g, b, a) => { o[0] += (r - o[0]) * a; o[1] += (g - o[1]) * a; o[2] += (b - o[2]) * a; };
function sdHeart(x, y) { // tip at origin, lobes up, about 1.1 tall
  x = Math.abs(x);
  if (y + x > 1) { const dx = x - .25, dy = y - .75; return Math.sqrt(dx * dx + dy * dy) - .35355; }
  const m = .5 * Math.max(x + y, 0), a = x * x + (y - 1) * (y - 1), b = (x - m) * (x - m) + (y - m) * (y - m);
  return Math.sqrt(Math.min(a, b)) * Math.sign(x - y);
}
const heart = (x, y, s) => sdHeart(x / s, y / s + .56) * s;
function sdStar(x, y, r, rf) {
  const k1x = .809016994375, k1y = -.587785252292;
  x = Math.abs(x);
  let d = Math.max(k1x * x + k1y * y, 0); x -= 2 * d * k1x; y -= 2 * d * k1y;
  d = Math.max(-k1x * x + k1y * y, 0); x -= 2 * d * -k1x; y -= 2 * d * k1y;
  x = Math.abs(x); y -= r;
  const bx = rf * -k1y, by = rf * k1x - 1;
  const h = clamp((x * bx + y * by) / (bx * bx + by * by), 0, r);
  return Math.hypot(x - bx * h, y - by * h) * Math.sign(y * bx - x * by);
}
function sdSeg(x, y, ax, ay, bx, by) {
  const px = x - ax, py = y - ay, dx = bx - ax, dy = by - ay;
  const h = clamp((px * dx + py * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(px - dx * h, py - dy * h);
}
function hsv(h, s, v, o) {
  h = ((h % 1) + 1) % 1; const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  switch (i) { case 0: o[0] = v; o[1] = t; o[2] = p; break; case 1: o[0] = q; o[1] = v; o[2] = p; break; case 2: o[0] = p; o[1] = v; o[2] = t; break;
    case 3: o[0] = p; o[1] = q; o[2] = v; break; case 4: o[0] = t; o[1] = p; o[2] = v; break; default: o[0] = v; o[1] = p; o[2] = q; }
}
const tmp = [0, 0, 0];

const P = {
  heartbeat: { name: 'Heartbeat', fn(x, y, t, o) {
    const b = (t * 1.1) % 1, pulse = Math.exp(-b * 9) + .65 * Math.exp(-Math.pow(b - .24, 2) * 260);
    const s = .8 * (1 + .1 * pulse), d = heart(x, y, s);
    const echo = cov(Math.abs(d - b * .55) - .03) * (1 - b) * (1 - b) * .55;
    put(o, 1, .05, .1, echo);
    put(o, 1, .07, .12, cov(d));
    put(o, 1, .42, .5, cov(d + .2) * (.35 + .65 * pulse));
    const gl = Math.hypot(x + .32, y - .34); put(o, 1, .85, .88, cov(gl - .09) * cov(d + .1) * .9);
  } },
  loverain: { name: 'Love rain', fn(x, y, t, o) {
    for (let k = -1; k <= 1; k++) {
      const sp = .55 + .22 * (k + 1) + (k === 0 ? .25 : 0), yy = y + t * sp + k * 1.37, row = Math.floor(yy / .78), ly = yy - row * .78 - .39;
      const wob = .06 * Math.sin(t * 2 + row * 1.7 + k), d = heart(x - k * .58 - wob, ly, .3);
      if ((row + k) & 1) put(o, 1, .4, .52, cov(d)); else put(o, 1, .06, .12, cov(d));
    }
  } },
  ladybug: { name: 'Ladybug', fn(x, y, t, o) {
    const a = .13 * Math.sin(t * 2.6), ca = Math.cos(a), sa = Math.sin(a);
    const yb = y - .03 * Math.abs(Math.sin(t * 5.2));
    const px = x * ca - yb * sa, py = x * sa + yb * ca + .12;
    for (let k = 0; k < 3; k++) for (const s of [-1, 1]) { // legs
      const w = .09 * Math.sin(t * 10.4 + k * 2.1 + (s > 0 ? PI : 0)), ly = .22 - k * .3;
      put(o, .9, .25, .3, cov(sdSeg(px, py, s * .5, ly, s * .84, ly - .1 + w) - .035));
    }
    put(o, 1, .9, .9, cov(sdSeg(px, py, -.1, .6, -.26, .88) - .03)); put(o, 1, .9, .9, cov(sdSeg(px, py, .1, .6, .26, .88) - .03));
    put(o, 1, .93, .93, cov(Math.hypot(px, py - .5) - .27));
    const blink = (t % 3.1) > 2.95 ? .2 : 1;
    for (const s of [-1, 1]) put(o, 0, 0, 0, cov((Math.hypot((px - s * .11) / .055, (py - .58) / (.07 * blink)) - 1) * .055));
    const body = Math.hypot(px, py + .08) - .6; put(o, 1, .06, .1, cov(body));

        fl.type = 'bandpass'; fl.Q.value = 3; fl.frequency.setValueAtTime(900, t + .1); fl.frequency.exponentialRampToValueAtTime(1500, t + .25); fl.frequency.exponentialRampToValueAtTime(600, t + .5);

        tone({ f: 90, f2: 45, t: t + dt + .58, d: .1, g: .3 * v, out: o }); noise({ t: t + dt + .58, d: .06, g: .07, type: 'lowpass', f: 500, out: o }); }); },  // and land

})();
for (const k in P) P[k].key = k;
const panOf = o => { const v = o.getWorldPosition(new THREE.Vector3()).project(camera); return clamp(v.x * .8, -.8, .8); };

/* ───────────── interaction ───────────── */

const names = [0, 1, 2].map(i => document.getElementById('n' + i));

function nextLamp(i, user = true) {

  L.cur = (L.cur + 1) % L.programs.length; setProgram(L, L.programs[L.cur]);
  L.squash.v -= 5; L.tilt.v -= 5; L.flash = 1; if (user) { state.lastTouch = clock; Sfx.lamp(i, L.programs[L.cur].key, panOf(L.g)); } refreshNames();
}
function swingSign() { Sfx.dino(panOf(sign1.children[0])); state.swing.v += (Math.random() < .5 ? -1 : 1) * 2.4; state.dinoT = 0; state.lastTouch = clock; }
function flipSign() { state.flip.t += PI; arrowFace ^= 1; Sfx.flip(arrowFace, panOf(sign2)); state.s2tilt.v += 3; state.lastTouch = clock; }
const partyBtn = document.getElementById('party');
function party() {
  if (state.party > 0) return; state.party = 7; Sfx.party(panOf(btn.cap), 7); state.lastTouch = clock; btn.press.v -= 9; btn.glow = 1;
  lamps.forEach(L => { setProgram(L, P.party); L.flash = 1; L.squash.v -= 4; });
  state.bloom.t = 0.55; partyBtn.setAttribute('aria-pressed', 'true'); refreshNames();
  setTimeout(() => { state.swing.v += 3; state.dinoT = 0; }, 350); setTimeout(() => { state.flip.t += TAU; }, 900);
}
function endParty() {
  state.party = 0; state.bloom.t = 0.5; partyBtn.setAttribute('aria-pressed', 'false');
  lamps.forEach(L => { L.cur = (L.cur + 1) % L.programs.length; setProgram(L, L.programs[L.cur]); L.flash = 1; }); refreshNames();
}
function act(hit) { if (!hit) return; if (hit.kind === 'lamp') nextLamp(hit.i); else if (hit.kind === 'sign1') swingSign(); else if (hit.kind === 'sign2') flipSign(); else if (hit.kind === 'button') party(); }
[0, 1, 2].forEach(i => document.getElementById('b' + i).addEventListener('click', () => nextLamp(i)));
partyBtn.addEventListener('click', party);
const sndBtn = document.getElementById('snd'); sndBtn.setAttribute('aria-pressed', String(!Sfx.muted));
sndBtn.addEventListener('click', () => { Sfx.setMuted(!Sfx.muted); sndBtn.setAttribute('aria-pressed', String(!Sfx.muted)); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = document.getElementById('tip');
