<!doctype html>
<html lang="en">
<head>

<body>
<title>Flick Lighter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed studio shot of the lighter on a black mirror. Title top left, how-to top right, controls along the bottom. */
:root{
  --void:#030306;
  --ink:#f3efe8;
  --dim:#9a958c;
  --flame:#ffb347;
  --line:rgba(255,236,210,.16);
  --glass:rgba(14,12,10,.55);
  --serif:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100%;width:100%;overflow:hidden;background:var(--void)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab;-webkit-user-select:none;user-select:none}
#gl.hot{cursor:pointer}
#gl.drag{cursor:grabbing}

.corner{position:absolute;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.tl{top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px))}
.tr{top:calc(22px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));align-items:flex-end;text-align:right;max-width:min(40vw,270px)}
.brand{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.6vw,52px);line-height:.9;letter-spacing:-.01em;margin:0}
.brand em{color:var(--flame)}
.sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.hint{font-size:12px;line-height:1.55;color:var(--dim);text-wrap:balance}
.hint b{color:var(--ink);font-weight:500}

.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;pointer-events:none;
  padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grp{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;align-items:center}
button{font:500 12.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:11px 15px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s ease,background .15s ease,border-color .15s ease;-webkit-tap-highlight-color:transparent}
button:hover{border-color:rgba(255,190,110,.55)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.act{text-transform:uppercase;letter-spacing:.14em;min-width:96px}
#strike{background:var(--ink);color:#120d08;border-color:var(--ink)}
.skins{gap:6px}
.sk{width:34px;height:34px;padding:0;display:grid;place-items:center}
.sk i{width:20px;height:20px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sk[aria-pressed="true"]{border-color:var(--flame);box-shadow:0 0 0 1px var(--flame)}
#fl[aria-pressed="true"]{border-color:var(--flame);color:var(--flame)}
#snd{padding:10px 12px;display:inline-flex;align-items:center}
#snd .off,#snd[aria-pressed="false"] .on{display:none}
#snd[aria-pressed="false"] .off{display:inline}
#snd[aria-pressed="false"]{color:var(--dim)}
#cue{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;
  color:#170f05;background:var(--flame);border-color:var(--flame);white-space:nowrap;animation:cue 1.6s ease-in-out infinite;z-index:3}
@keyframes cue{50%{box-shadow:0 0 0 8px rgba(255,179,71,.18)}}
#skinName{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-left:4px;min-width:9ch}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;color:var(--dim)}
@media (max-width:620px){
  .tr{display:none}
  #skinName{display:none}
  #cue{top:auto;bottom:calc(126px + env(safe-area-inset-bottom,0px))}
  .act{min-width:0}
}
@media (prefers-reduced-motion:reduce){button{transition:none}#cue{animation:none}}
</style>

<div id="stage">
  <canvas id="gl" tabindex="-1" aria-label="A flip-top windproof metal lighter standing on a black mirror. Use the buttons below to open the lid, strike the wheel and change the finish."></canvas>
  <div class="corner tl">
    <h1 class="brand">Flick<em>.</em></h1>
    <span class="sub">Windproof lighter · No. 41</span>
  </div>
  <div class="corner tr">
    <span class="hint"><b>Tap the lid</b> to flick it open. <b>Swipe down on the wheel</b> to strike. <b>Drag the lighter</b> to swing the flame. Drag empty space to look around.</span>
  </div>
  <button type="button" id="cue" hidden>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/></svg><span id="cueText">Tap anywhere for sound</span>
  </button>
  <div class="bar">
    <div class="grp">
      <button type="button" class="act" id="lid">Open</button>
      <button type="button" class="act" id="strike">Strike</button>
      <button type="button" id="fl" aria-pressed="false" title="Prism flame">Prism</button>
      <button type="button" id="snd" aria-pressed="true" aria-label="Sound"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    </div>
    <div class="grp skins" role="group" aria-label="Finish">
      <span id="skinName">Aurora</span>
      <button type="button" class="sk" data-skin="0" aria-pressed="true" aria-label="Aurora finish"><i style="background:conic-gradient(from 200deg,#1fb7c0,#2a5cf0,#7b3cf0,#d03ab0,#1fb7c0)"></i></button>
      <button type="button" class="sk" data-skin="1" aria-pressed="false" aria-label="Oil slick brass finish"><i style="background:radial-gradient(circle at 35% 35%,#e8d9b0,#9c8a62 45%,#4c7cc2 62%,#c9549a 78%,#d4a74a)"></i></button>
      <button type="button" class="sk" data-skin="2" aria-pressed="false" aria-label="Brushed chrome finish"><i style="background:linear-gradient(90deg,#8d8a85,#f1eee8 40%,#a9a59f 60%,#e6e2dc)"></i></button>
      <button type="button" class="sk" data-skin="3" aria-pressed="false" aria-label="Matte black finish"><i style="background:radial-gradient(circle at 35% 30%,#3a3d42,#0b0c0e 60%)"></i></button>
    </div>
  </div>
  <div id="fail" hidden>This piece needs WebGL, and it could not start on this device.</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const $ = id => document.getElementById(id);
const canvas = $('gl');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);

/* ═════════════════════════ Sound: modal metal, flint grit, gas ═════════════════════════ */
const Sfx = (() => {
  let ac = null, master, room, noise, brown, muted = false, tried = false, scr = null, burn = null;
  try { muted = localStorage.getItem('flick-muted') === '1'; } catch (e) {}
  const cue = $('cue'), cueText = $('cueText'), snd = $('snd');
  snd.setAttribute('aria-pressed', String(!muted));
  function report() {
    const ok = ac && ac.state === 'running';
    cue.hidden = muted || ok;
    if (!ok && tried) cueText.textContent = 'Sound is blocked. Tap here to turn it on';
  }
  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -10; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = 0.001; comp.release.value = 0.15;
    master = ac.createGain(); master.gain.value = muted ? 0 : 1;
    master.connect(comp); comp.connect(ac.destination);
    const len = ac.sampleRate * 2;
    noise = ac.createBuffer(1, len, ac.sampleRate);
    { const d = noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
    brown = ac.createBuffer(1, len, ac.sampleRate);
    { const b = brown.getChannelData(0); let y = 0; for (let i = 0; i < len; i++) { y = (y + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = y * 3.5; } }
    // small, bright room: a desk by a wall. Early reflections then a short diffuse tail.
    const il = Math.floor(ac.sampleRate * 0.7), ir = ac.createBuffer(2, il, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const x = ir.getChannelData(c); let y = 0;
      for (let i = 0; i < il; i++) { const k = i / il; y += ((Math.random() * 2 - 1) - y) * (0.7 - 0.5 * k); x[i] = y * Math.pow(1 - k, 3.2); }
      for (const ms of [7, 11, 17, 23, 31]) { const j = Math.floor(ac.sampleRate * ms / 1000 * (1 + c * 0.07)); if (j < il) x[j] += 0.5 * (Math.random() < 0.5 ? -1 : 1); }
    }
    room = ac.createConvolver(); room.buffer = ir;
    const rg = ac.createGain(); rg.gain.value = 0.22; room.connect(rg); rg.connect(master);
    ac.onstatechange = report;
  }
  function unlock() {
    if (!ac) build();
    if (!ac) return;
    if (ac.state !== 'running') {
      const p = ac.resume(); if (p && p.then) p.then(report, report);
      try { const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); } catch (e) {}
      setTimeout(() => { tried = true; report(); }, 500);
    }
    report();
  }
  const live = () => ac && ac.state === 'running' && !muted;
  const out = (g, wet) => { g.connect(master); if (wet) { const w = ac.createGain(); w.gain.value = wet; g.connect(w); w.connect(room); } };
  /* ringing partials of thin sheet steel: [freq, amp, T60 seconds]. Random start phase, slight detune, pairs beat. */
  function ring(t, partials, gain, pan = 0, wet = 0.6, spread = 0.012) {
    const bus = ac.createGain(); bus.gain.value = gain;
    const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if (p) { p.pan.value = pan; bus.connect(p); out(p, wet); } else out(bus, wet);
    const j = 1 + (Math.random() - 0.5) * spread * 2;
    for (const [f, a, d] of partials) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f * j * (1 + (Math.random() - 0.5) * 0.004);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.0008);
      g.gain.setTargetAtTime(0, t + 0.0008, d / 6.9);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + d * 1.2 + 0.05);
    }
    return bus;
  }
  function burst(t, peak, dur, type, f0, f1, q, wet = 0.3, buf) {
    const s = ac.createBufferSource(); s.buffer = buf || noise; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.002, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); out(g, wet);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  function thump(t, f0, f1, peak, dur) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); out(g, 0.1); o.start(t); o.stop(t + dur + 0.05);
  }
  /* flint wheel: noise chopped at the knurl's tooth rate through a bank of gritty resonances, all driven by wheel speed */
  function scrapeGraph() {
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const chop = ac.createGain(); chop.gain.value = 0.5;
    const lfo = ac.createOscillator(); lfo.type = 'sawtooth'; lfo.frequency.value = 80;
    const lg = ac.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(chop.gain);
    const drive = ac.createGain(); drive.gain.value = 0;
    const bands = [[2300, 3, 0.9], [3600, 4, 1], [5400, 5, 0.8], [7900, 4, 0.55], [11000, 2, 0.3]];
    for (const [f, q, a] of bands) {
      const b = ac.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = f; b.Q.value = q;
      const g = ac.createGain(); g.gain.value = a; chop.connect(b); b.connect(g); g.connect(drive);
    }
    const lo = ac.createBiquadFilter(); lo.type = 'bandpass'; lo.frequency.value = 900; lo.Q.value = 1.2;
    const lgn = ac.createGain(); lgn.gain.value = 0.35; chop.connect(lo); lo.connect(lgn); lgn.connect(drive);
    src.connect(chop); out(drive, 0.35);
    src.start(); lfo.start();
    scr = { drive, lfo };
  }
  /* the burning wick: low soft roar, a whisper of hiss, and wind flutter when the lighter moves */
  function burnGraph() {
    const b = ac.createBufferSource(); b.buffer = brown; b.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.4;
    const g = ac.createGain(); g.gain.value = 0;
    b.connect(lp); lp.connect(g);
    const h = ac.createBufferSource(); h.buffer = noise; h.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 1500; hp.Q.value = 0.6;
    const hg = ac.createGain(); hg.gain.value = 0.02; h.connect(hp); hp.connect(hg); hg.connect(g);
    const w = ac.createBufferSource(); w.buffer = brown; w.loop = true;
    const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 260; wf.Q.value = 0.9;
    const wg = ac.createGain(); wg.gain.value = 0;
    w.connect(wf); wf.connect(wg); out(wg, 0.15);
    out(g, 0.12);
    b.start(); h.start(0, 0.7); w.start(0, 1.1);
    burn = { g, lp, wg, wf };
  }
  return {
    unlock, live,
    toggle() {
      muted = !muted; try { localStorage.setItem('flick-muted', muted ? '1' : '0'); } catch (e) {}
      snd.setAttribute('aria-pressed', String(!muted));
      if (ac) master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.02);
      report();
    },
    /* cam lets go of the lid tab: the first, crisp click */
    cam(v = 1) {
      if (!live()) return; const t = ac.currentTime;
      burst(t, 0.55 * v, 0.006, 'highpass', 2600, 2600, 0.7, 0.3);
      ring(t, [[2870, 0.18, 0.07], [4310, 0.14, 0.06], [6760, 0.1, 0.05], [9200, 0.05, 0.03]], v, -0.1, 0.4);
    },
    /* lid hits its open stop: the long bright "ching" the lighter is famous for */
    openStop(v = 1) {
      if (!live()) return; const t = ac.currentTime + 0.004;
      burst(t, 0.6 * v, 0.007, 'bandpass', 5200, 4800, 0.8, 0.4);
      burst(t, 0.25 * v, 0.03, 'lowpass', 1400, 700, 0.7, 0.2);
      ring(t, [[1984, 0.12, 0.38], [3148, 0.22, 0.5], [3171, 0.16, 0.48], [4526, 0.17, 0.36], [4551, 0.08, 0.33],
        [6043, 0.12, 0.26], [7655, 0.09, 0.19], [9911, 0.06, 0.12], [12380, 0.035, 0.08]], 0.9 * v, -0.25, 0.7);
    },
    /* lid slams shut: duller, shorter clack with the cam tick just before it */
    camTick(v = 1) {
      if (!live()) return; const t = ac.currentTime;
      burst(t, 0.3 * v, 0.004, 'bandpass', 3400, 3400, 1.5, 0.2);
      ring(t, [[3320, 0.08, 0.04], [5100, 0.05, 0.03]], v, -0.1, 0.3);
    },
    clack(v = 1) {
      if (!live()) return; const t = ac.currentTime;
      burst(t, 0.9 * v, 0.012, 'lowpass', 6000, 2500, 0.6, 0.35);
      burst(t, 0.5 * v, 0.004, 'highpass', 4000, 4000, 0.7, 0.2);
      thump(t, 190, 85, 0.35 * v, 0.06);
      ring(t, [[812, 0.22, 0.05], [1463, 0.22, 0.07], [2349, 0.2, 0.08], [3378, 0.15, 0.06], [4702, 0.1, 0.05], [6620, 0.05, 0.03]], 0.9 * v, -0.05, 0.4);
    },
    /* wheel speed in rad/s, called every frame */
    wheel(w) {
      if (!live()) return;
      if (!scr) scrapeGraph();
      const t = ac.currentTime, s = clamp((Math.abs(w) - 1.5) / 34, 0, 1);
      scr.drive.gain.setTargetAtTime(Math.pow(s, 1.1) * 1.1, t, s > 0 ? 0.006 : 0.02);
      scr.lfo.frequency.setTargetAtTime(30 + Math.abs(w) * 6.2, t, 0.01);
    },
    wheelCatch(v = 1) {   // thumb grabs the knurl
      if (!live()) return; const t = ac.currentTime;
      burst(t, 0.35 * v, 0.01, 'bandpass', 1700, 1300, 1.6, 0.2);
      ring(t, [[2410, 0.06, 0.05], [3890, 0.04, 0.04]], v, 0.2, 0.3);
    },
    thumb(v = 1) {        // thumb lands on the case after the roll
      if (!live()) return; const t = ac.currentTime;
      burst(t, 0.3 * v, 0.045, 'lowpass', 700, 300, 0.7, 0.15, brown);
      thump(t, 140, 80, 0.18 * v, 0.06);
    },
    sparks(n) {          // tiny crackles, one per few sparks
      if (!live() || n <= 0) return; const t = ac.currentTime;
      for (let i = 0; i < Math.min(n, 5); i++) {
        const f = rnd(3500, 10000);
        burst(t + rnd(0.02), rnd(0.04, 0.16), rnd(0.0015, 0.004), 'bandpass', f, f, rnd(2, 6), 0.4);
      }
    },
    ignite() {
      if (!live()) return; const t = ac.currentTime;
      if (!burn) burnGraph();
      // vapour catches: a soft fwump that opens and settles
      const s = ac.createBufferSource(); s.buffer = brown; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.8;
      f.frequency.setValueAtTime(160, t); f.frequency.exponentialRampToValueAtTime(1700, t + 0.05); f.frequency.exponentialRampToValueAtTime(380, t + 0.5);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.3, t + 0.035); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
      s.connect(f); f.connect(g); out(g, 0.3); s.start(t, Math.random()); s.stop(t + 0.7);
      burst(t + 0.005, 0.18, 0.22, 'bandpass', 2600, 1200, 0.8, 0.3);
      thump(t, 70, 46, 0.35, 0.22);
    },
    snuff() {
      if (!live()) return; const t = ac.currentTime;
      burst(t, 0.25, 0.09, 'lowpass', 700, 200, 0.6, 0.1, brown);
    },
    flame(lit, flick, speed) {   // every frame
      if (!ac || !burn) { if (lit > 0.01 && live()) burnGraph(); return; }
      const t = ac.currentTime, on = live() ? lit : 0;
      burn.g.gain.setTargetAtTime(on * (0.1 + 0.06 * flick), t, 0.04);
      burn.lp.frequency.setTargetAtTime(330 + 260 * flick + speed * 40, t, 0.05);
      const w = clamp(speed / 22, 0, 1);
      burn.wg.gain.setTargetAtTime(on * w * w * 0.7, t, 0.05);
      burn.wf.frequency.setTargetAtTime(200 + w * 500, t, 0.05);
    },
    land(v) {
      if (!live() || v < 0.05) return; const t = ac.currentTime;
      burst(t, 0.8 * v, 0.01, 'lowpass', 4200, 2000, 0.6, 0.3);
      thump(t, 150, 70, 0.45 * v, 0.07);

/* ═════════════════════════ Layout ═════════════════════════ */
const target = new THREE.Vector3(-1.05, 3.4, 0);
let baseDist = 30;
function resize() {

/* ═════════════════════════ Loop ═════════════════════════ */
const clock = new THREE.Clock();
const wickW = new THREE.Vector3(), sparkW = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), dirX = new THREE.Vector3();
let flickA = 0, flickB = 0;

function step(dt) {
  S.time += dt;
  const t = S.time;

  /* lid: flicked with momentum, bounces off its stops, cam springs hold it */
  {
    const prev = S.lidA;
    if (!S.lidHit) {
      S.lidA += S.lidV * dt;
      if (S.lidTarget === OPEN) {
        S.lidV *= Math.exp(-dt * 1.5);
        if (!S.camDone && S.lidA > 0.1) { S.camDone = true; Sfx.cam(1); }
        if (S.lidA >= OPEN) { S.lidA = OPEN; Sfx.openStop(clamp(Math.abs(S.lidV) / 22, 0.3, 1)); S.lidV = -Math.abs(S.lidV) * 0.22; S.lidHit = true; }
      } else {
        S.lidV -= 12 * dt;

      }

      S.lidA += S.lidV * dt;

  }

  /* lighter body: held and swung, or falling back to the mirror */

    const p = lighter.position;

      const tgt = S.holdT.clone(); tgt.y = Math.max(0, tgt.y);
