<style>
/* Layout: one full-bleed black studio shot. The toy is the page; type sits in the corners like a title card, fuse readout bottom left. */
:root{
  --void:#04050b;
  --void-lift:#0b0e20;
  --ink:#eef3ff;
  --dim:#8b91b8;
  --violet:#7a2cff;
  --cyan:#7fe9ff;
  --hot:#ff2bd0;
  --gold:#ffc21a;
  --line:rgba(160,180,255,.18);
  --glass:rgba(16,18,40,.55);
  --display:"Unbounded","Arial Black","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(90% 70% at 52% 45%,var(--void-lift) 0%,var(--void) 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab;-webkit-user-select:none;user-select:none}
#gl.ring{cursor:pointer}
#gl.drag{cursor:grabbing}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 48%,#fff 0%,#d9f7ff 22%,rgba(170,90,255,.75) 55%,rgba(60,10,160,0) 100%)}

.corner{position:absolute;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.tl{top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px))}
.tr{top:calc(22px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));align-items:flex-end;text-align:right;max-width:min(42vw,250px)}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,30px);line-height:1;letter-spacing:-.01em;text-transform:uppercase;margin:0}
.brand em{font-style:normal;color:var(--gold)}
.sub,.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hint{font-size:12.5px;line-height:1.45;color:var(--dim);text-wrap:balance}

.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;pointer-events:none;
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.fuse{display:flex;flex-direction:column;gap:4px;min-width:0}
.fuse .row{display:flex;align-items:center;gap:8px}
.led{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);flex:none}
[data-state="live"] .led{background:var(--hot);box-shadow:0 0 12px var(--hot)}
[data-state="boom"] .led{background:var(--gold);box-shadow:0 0 12px var(--gold)}
#timer{font:500 clamp(34px,7vw,58px)/.9 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ink)}
[data-state="live"] #timer{color:var(--hot);text-shadow:0 0 22px rgba(255,43,208,.55)}
.ctl{display:flex;gap:8px;pointer-events:auto}
.ctl button,#cue{font:500 13px/1 var(--mono);letter-spacing:.04em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:12px 16px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s ease,background .15s ease,border-color .15s ease}
.ctl button:hover{border-color:rgba(127,233,255,.6)}
.ctl button:active{transform:scale(.96)}
.ctl button:focus-visible,#cue:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#act{min-width:132px;text-transform:uppercase;letter-spacing:.12em}
#act[data-mode="reset"]{background:var(--ink);color:var(--void);border-color:var(--ink)}
#act:disabled{opacity:.45;cursor:default}
#snd{padding:11px 13px;display:inline-flex;align-items:center}
#snd .off,#snd[aria-pressed="false"] .on{display:none}
#snd[aria-pressed="false"] .off{display:inline}
#snd[aria-pressed="false"]{color:var(--dim)}
#cue{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;
  color:var(--void);background:var(--gold);border-color:var(--gold);white-space:nowrap;animation:cue 1.6s ease-in-out infinite}
@keyframes cue{50%{box-shadow:0 0 0 8px rgba(255,194,26,.16)}}
#tag{position:absolute;left:0;top:0;pointer-events:none;font:500 10.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);
  padding:5px 7px;border:1px solid rgba(127,233,255,.45);border-radius:999px;background:rgba(4,5,11,.55);white-space:nowrap;opacity:0;transition:opacity .25s ease;will-change:transform}
#tag.on{opacity:1}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;color:var(--dim)}
@media (max-width:560px){
  .tr{display:none}
  #cue{top:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.ctl button{transition:none}#cue{animation:none}}
</style>

<div id="stage" data-state="armed">
  <canvas id="gl" tabindex="-1" aria-label="A glossy purple toy grenade with a gold smiley sticker, a glowing lever and a pull ring. Use the button below to pull the pin."></canvas>
  <div id="flash"></div>
  <div class="corner tl">
    <h1 class="brand">Have a<br><em>nice</em> day</h1>
    <span class="sub">Smiley grenade · toy no. 0K5485864</span>
  </div>
  <div class="corner tr">
    <span class="hint" id="hint">Drag the ring to pull the pin, or click it. Drag anywhere else to turn the toy. Sound on.</span>
  </div>
  <div id="tag">Pull</div>
  <button type="button" id="cue" hidden>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/></svg><span id="cueText">Tap anywhere for sound</span>
  </button>
  <div class="bar">
    <div class="fuse" aria-live="off">
      <div class="row"><span class="led"></span><span class="label" id="status">Armed · pin in</span></div>
      <output id="timer" aria-label="Fuse, seconds">3.00</output>
    </div>
    <div class="ctl">
      <button type="button" id="act" data-mode="pull">Pull the pin</button>
      <button type="button" id="snd" aria-pressed="true" aria-label="Sound"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    </div>
  </div>
  <div id="fail" hidden>This piece needs WebGL, and it could not start on this device.</div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FUSE = 3.0;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

    const il = Math.floor(ac.sampleRate * 2.4), ir = ac.createBuffer(2, il, ac.sampleRate);

  function burst(t, peak, attack, decay, type, f0, f1, q, dest, wet = 0) {

  function scrapeGraph() {
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const drive = ac.createGain(); drive.gain.value = 0;
    const chop = ac.createGain(); chop.gain.value = 0.55;

    unlock, live,
    get ctx() { return ac; },
    toggle() {
      muted = !muted; try { localStorage.setItem('sg-muted', muted ? '1' : '0'); } catch (e) {}

    scrape(speed, pull) {

    },
    pinOut() {

    spoon() {

      [1270, 2930, 4410].forEach((f, i) => tone('sine', f, f * 0.985, t + 0.004, 0.22 / (1 + i), 0.001, 0.5, null, 0.6));
      tone('sine', 96, 190, t + 0.01, 0.2, 0.004, 0.3);            // spring boing

    },
    ticks(times) {

      tickBus = ac.createGain(); tickBus.gain.value = 1; tickBus.connect(master);
      const w = ac.createGain(); w.gain.value = 0.18; tickBus.connect(w); w.connect(verb);

      this.cancelTicks();
