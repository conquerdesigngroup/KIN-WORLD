<title>Let Us Out</title>

<style>
/* Layout: one full-bleed black stage; the bag of balls is the whole page, UI is a quiet rim of small controls. */
:root{
  --stage:#000000;
  --ink:#f3ead2;
  --ink-dim:rgba(243,234,210,.56);
  --felt:#f7b40a;
  --chip:rgba(255,255,255,.07);
  --chip-line:rgba(255,255,255,.14);
  --warn:#ff7a3d;
  --font:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#stage.grabbing{cursor:grabbing}
#stage.over{cursor:pointer}
.hud{position:fixed;pointer-events:none;z-index:2}
.top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{display:flex;flex-direction:column;gap:2px}
.mark b{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--felt)}
.mark span{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.bottom{bottom:0;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hints{display:flex;flex-wrap:wrap;gap:6px;min-width:0;transition:opacity .8s}
.hints.quiet{opacity:.38}
.hints span{font-size:12px;color:var(--ink-dim);border:1px solid var(--chip-line);background:var(--chip);
  border-radius:999px;padding:5px 10px;white-space:nowrap}
.btns{display:flex;gap:8px;pointer-events:auto;margin-left:auto}
button{font:500 13px var(--font);color:var(--ink);background:var(--chip);border:1px solid var(--chip-line);
  border-radius:999px;padding:9px 14px;cursor:pointer;touch-action:none}
button:hover{background:rgba(255,255,255,.12)}
button:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
button.on{background:var(--felt);color:#1a1200;border-color:var(--felt)}
button.warn{border-color:var(--warn);color:var(--warn);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(255,122,61,.18)}}
@media (prefers-reduced-motion:reduce){button.warn{animation:none}}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-dim);font-size:15px}
</style>

</div>

    <button id="soundBtn" type="button" aria-pressed="true">Sound on</button>
  </div>
</div>

  computeHard(); relaxMembrane(2); writeMembrane(); syncMeshes();
  // sound that follows the stretch
  const rate = Math.abs(stretchNow - stretchPrev) / Math.max(dt, .004), sqRate = Math.abs(sq.s - sqPrev) / Math.max(dt, .004);
  stretchPrev = stretchNow; sqPrev = sq.s;
  const user = grabbed >= 0 ? 1 : .32;
  Sfx.stretch(Math.min(1, stretchNow / 1.6), rate * user);
  if (Math.random() < (rate * .5 * user + sqRate * 1.4) * dt * 60 * .25) Sfx.crinkle(Math.min(1, rate * .4 * user + sqRate * .5));
  statT += dt; if (statT > .1) { statT = 0; statEl.textContent = 'bag stretch ' + Math.round(100 * (1 + stretchNow / R_ENV)) + '%'; }
  placeCamera(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame((t) => { last = t; frame(t); });

// test hooks
window.__luo = { computeHard, relaxMembrane, writeMembrane, balls, step, Sfx, sq, group, camera, renderer,
  grab(i, x, y, z) { grabbed = i; balls[i].esc = null; grabTarget.set(x, y, z); }, release() { grabbed = -1; },
  squeeze(v) { wheelSq = v; wheelT = 1e15; }, stretch: () => stretchNow, nv: NV };
